<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Маленькое, но искреннее извинение для любимой сестры." />
    <meta name="theme-color" content="#f9d9df" />
    <title>Извини ♥</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="glow glow-one" aria-hidden="true"></div>
      <div class="glow glow-two" aria-hidden="true"></div>
      <div class="heart-burst" aria-hidden="true"></div>

      <section class="apology-card" aria-labelledby="apology-title">
        <div class="mini-heart" aria-hidden="true">♥</div>
        <p class="eyebrow">моей любимой сестре</p>
        <h1 id="apology-title">Извини</h1>
        <p class="message">
          Я неудачно пошутил и совсем не хотел тебя обидеть.
          <br />
          Ты мне очень дорога.
        </p>
        <div class="signature">
          <span class="signature-line"></span>
          <span>Обнимаю</span>
          <span class="signature-line"></span>
        </div>
        <button class="heart-button" type="button">
          <span aria-hidden="true">♥</span>
          Ещё немного любви
        </button>
      </section>

      <p class="footer-note">Я правда больше так не буду</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
